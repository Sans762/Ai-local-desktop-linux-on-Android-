name: Build Stabilizer Lab v1.1 APK
on:
  push:
    branches: [stabilizer-lab-v11]
    paths-ignore:
      - 'StabilizerLab-v1.1-debug.apk'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply stabilized lens enumeration and gyro patch
        run: |
          mkdir -p source
          unzip -q StabilizerLabSource.zip -d source
          base64 -d StabilizerLab_v1.1.patch.gz.b64 | gzip -dc | patch -p1 -d source
          grep "versionName '1.1.0'" source/app/build.gradle
      - name: Test sensor algorithms
        run: |
          mkdir -p /tmp/stabilizer-tests
          javac -d /tmp/stabilizer-tests source/app/src/main/java/com/mikeki/camerastabilizer/SensorStabilityAnalyzer.java source/app/src/main/java/com/mikeki/camerastabilizer/GyroBiasCalibrator.java source/tests/SensorStabilityAnalyzerTest.java source/tests/GyroBiasCalibratorTest.java
          java -cp /tmp/stabilizer-tests SensorStabilityAnalyzerTest
          java -cp /tmp/stabilizer-tests GyroBiasCalibratorTest
      - name: Compile debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StabilizerLab-v1.1-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK for direct download
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk StabilizerLab-v1.1-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StabilizerLab-v1.1-debug.apk
          git commit -m "Publish Stabilizer Lab v1.1 compiled APK"
          git push origin HEAD:stabilizer-lab-v11
