name: Build Stabilizer Lab APK
on:
  push:
    branches: [stabilizer-lab-apk-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract application source
        run: mkdir -p source && unzip -q StabilizerLabSource.zip -d source
      - name: Test motion analyzer
        run: |
          mkdir -p /tmp/stabtests
          javac -d /tmp/stabtests source/app/src/main/java/com/mikeki/camerastabilizer/SensorStabilityAnalyzer.java source/tests/SensorStabilityAnalyzerTest.java
          java -cp /tmp/stabtests SensorStabilityAnalyzerTest
      - name: Compile Android APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StabilizerLab-v1.0-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
