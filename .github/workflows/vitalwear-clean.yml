name: VitalWear original-source clean rebuild
on:
  push:
    branches:
      - experimental/vitalwear-clean-upstream
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clean-vitalwear-v082-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: vitalwear-v082-clean-signing-20261120
      - name: Prepare a consistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=VitalWear Clean Dev,O=VitalWear,C=TH' -noprompt
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep SHA256
          # Fail closed if CI cache disappears and generates a new key.
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -q '5C:FF:24:65:1F:F0:64:E6:81:33:C4:85:77:C9:FB:5F:C6:21:45:C7:F8:73:CB:60:5C:9E:2F:CE:30:56:31:7E'
      - name: Install Android build SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Clone the actual upstream originals
        run: |
          git clone --depth 1 https://github.com/cfogrady/VitalWear.git VitalWear
          # Previously installed game DB schema: watch v8, phone v4.
          # Data-only source reference; do not use its UI or gameplay code.
          git clone --depth 1 https://github.com/457R0/VitalWear.git VitalWearForkSchema
          git clone --depth 1 --branch java8 https://github.com/cfogrady/VB-DIM-Reader.git VB-DIM-Reader
          git clone --depth 1 https://github.com/cfogrady/nearby-connections-p2p.git NearbyP2P
          git -C VitalWear rev-parse HEAD
          git -C VB-DIM-Reader rev-parse HEAD
      - name: Build DIM reader dependency
        run: |
          cd VB-DIM-Reader
          # Git version plugin is only for jar naming; plugin portal no longer
          # reliably resolves its ancient JGit/jsch transitive dependencies.
          # Keep upstream Java 8 reader functionality unchanged.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build.gradle")
          s=p.read_text()
          s=s.replace('    id "io.toolebox.git-versioner" version "1.6.5"\n','')
          a=s.index("\nversioner {")
          b=s.index("\ntest {",a)
          s=s[:a]+"\n"+s[b:]
          s=s.replace("repositories {\n    mavenCentral()\n}",
            "repositories {\n    mavenCentral()\n    maven { url 'https://repo1.maven.org/maven2/' }\n    maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n}")
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew clean jar --no-daemon
          find build/libs -name '*.jar' -type f -print
          mkdir -p ../VitalWear/{app,common,companion}/libs
          JAR="$(find build/libs -type f -name '*.jar' ! -name '*sources*' | head -1)"
          test -n "$JAR"
          for module in app common companion; do
            cp "$JAR" "../VitalWear/$module/libs/VB-DIM-Reader.jar"
          done
      - name: Publish upstream Nearby P2P libraries locally
        run: |
          cd NearbyP2P
          chmod +x gradlew
          ./gradlew :connections:publishToMavenLocal :wear-ui:publishToMavenLocal --no-daemon --stacktrace
          test -f ~/.m2/repository/com/github/cfogrady/nearby/connections/p2p/connections/0.1.0/connections-0.1.0.aar
          test -f ~/.m2/repository/com/github/cfogrady/nearby/connections/p2p/wear-ui/0.1.0/wear-ui-0.1.0.aar
      - name: Patch only physical VB requirements and watch sensors
        run: |
          python3 vitalwear-clean/patch_original.py VitalWear
          python3 vitalwear-clean/check_original.py VitalWear
          python3 vitalwear-clean/fix_crash_081.py VitalWear VitalWearForkSchema
          python3 vitalwear-clean/check_crash_081.py VitalWear VitalWearForkSchema
          python3 vitalwear-clean/package_safe_v082.py VitalWear
          python3 vitalwear-clean/fix_startup_082.py VitalWear
          python3 vitalwear-clean/fix_runtime_v083.py VitalWear
          python3 vitalwear-clean/port_vbhelper_nfc_v084.py VitalWear VitalWearForkSchema
          python3 vitalwear-clean/check_vbhelper_nfc_v084.py VitalWear
          python3 vitalwear-clean/vbhelper_export_fix_v085.py VitalWear
          python3 vitalwear-clean/check_vbhelper_export_v085.py VitalWear
          python3 vitalwear-clean/fix_vbhelper_receive_v086.py VitalWear
          python3 vitalwear-clean/fix_install_signing_v087.py VitalWear
      - name: Assemble original-source Wear + companion APKs
        run: |
          cd VitalWear
          chmod +x gradlew
          ./gradlew :app:assembleDebug :companion:assembleDebug --no-daemon --stacktrace
      - name: Verify BOTH APK certificates use the permanent cached signer
        run: |
          set -eu
          EXPECTED=5cff24651ff064e68133c48577c9fb5fc62145c7f873cb605c9e2fce3056317e
          for module in app companion; do
            APK="VitalWear/$module/build/outputs/apk/debug/$module-debug.apk"
            /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee /tmp/"$module"-sign.txt
            grep -qi "$EXPECTED" /tmp/"$module"-sign.txt || {
              echo "REFUSE RELEASE: signer changed; this would break future in-place updates"
              exit 1
            }
          done
      - name: Assert both APKs contain required SLF4J runtime classes
        run: |
          python3 - <<'PY'
          import zipfile
          for module in ("app","companion"):
              path=f"VitalWear/{module}/build/outputs/apk/debug/{module}-debug.apk"
              with zipfile.ZipFile(path) as z:
                  dex=b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
                  assert b"Lorg/slf4j/LoggerFactory;" in dex, f"Missing SLF4J in {path}"
                  assert b"Lorg/slf4j/Logger;" in dex, f"Missing SLF4J Logger in {path}"
                  print("PASS contains SLF4J classes",path)
          PY
      - name: Check HCE registration and protobuf transfer metadata
        run: |
          python3 vitalwear-clean/check_vbhelper_nfc_v084.py VitalWear
      - name: Validate nondestructive export and VBHelper phone share
        run: python3 vitalwear-clean/check_vbhelper_export_v085.py VitalWear
      - name: Verify compiled Room schema compatibility with installed 0.6.x
        run: |
          python3 vitalwear-clean/check_crash_081.py VitalWear VitalWearForkSchema
      - name: Test project unit tests
        run: |
          cd VitalWear
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Collect APKs and verify archive contents
        if: always()
        run: |
          mkdir -p outputs
          if test -f VitalWear/app/build/outputs/apk/debug/app-debug.apk; then
            cp VitalWear/app/build/outputs/apk/debug/app-debug.apk outputs/VitalWear-Watch-Stable-v0.8.7.apk
          fi
          if test -f VitalWear/companion/build/outputs/apk/debug/companion-debug.apk; then
            cp VitalWear/companion/build/outputs/apk/debug/companion-debug.apk outputs/VitalWear-Phone-Stable-v0.8.7.apk
          fi
          if test -f outputs/VitalWear-Watch-Stable-v0.8.7.apk; then
            unzip -t outputs/VitalWear-Watch-Stable-v0.8.7.apk | tail -2
            sha256sum outputs/VitalWear-Watch-Stable-v0.8.7.apk
          fi
          if test -f outputs/VitalWear-Phone-Stable-v0.8.7.apk; then
            unzip -t outputs/VitalWear-Phone-Stable-v0.8.7.apk | tail -2
            sha256sum outputs/VitalWear-Phone-Stable-v0.8.7.apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VitalWear-v087-StableInstall-NFC-APKs
          path: outputs/*.apk
          retention-days: 30

