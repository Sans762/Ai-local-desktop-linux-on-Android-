name: VitalWear original-source clean rebuild
on:
  push:
    branches:
      - experimental/vitalwear-clean-upstream
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clean-vitalwear-v082-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: vitalwear-v082-clean-signing-20261120
      - name: Prepare a consistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=VitalWear Clean Dev,O=VitalWear,C=TH' -noprompt
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep SHA256
      - name: Install Android build SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Clone the actual upstream originals
        run: |
          git clone --depth 1 https://github.com/cfogrady/VitalWear.git VitalWear
          # Previously installed game DB schema: watch v8, phone v4.
          # Data-only source reference; do not use its UI or gameplay code.
          git clone --depth 1 https://github.com/457R0/VitalWear.git VitalWearForkSchema
          git clone --depth 1 --branch java8 https://github.com/cfogrady/VB-DIM-Reader.git VB-DIM-Reader
          git clone --depth 1 https://github.com/cfogrady/nearby-connections-p2p.git NearbyP2P
          git -C VitalWear rev-parse HEAD
          git -C VB-DIM-Reader rev-parse HEAD
      - name: Build DIM reader dependency
        run: |
          cd VB-DIM-Reader
          # Git version plugin is only for jar naming; plugin portal no longer
          # reliably resolves its ancient JGit/jsch transitive dependencies.
          # Keep upstream Java 8 reader functionality unchanged.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build.gradle")
          s=p.read_text()
          s=s.replace('    id "io.toolebox.git-versioner" version "1.6.5"\n','')
          a=s.index("\nversioner {")
          b=s.index("\ntest {",a)
          s=s[:a]+"\n"+s[b:]
          s=s.replace("repositories {\n    mavenCentral()\n}",
            "repositories {\n    mavenCentral()\n    maven { url 'https://repo1.maven.org/maven2/' }\n    maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n}")
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew clean jar --no-daemon
          find build/libs -name '*.jar' -type f -print
          mkdir -p ../VitalWear/{app,common,companion}/libs
          JAR="$(find build/libs -type f -name '*.jar' ! -name '*sources*' | head -1)"
          test -n "$JAR"
          for module in app common companion; do
            cp "$JAR" "../VitalWear/$module/libs/VB-DIM-Reader.jar"
          done
      - name: Publish upstream Nearby P2P libraries locally
        run: |
          cd NearbyP2P
          chmod +x gradlew
          ./gradlew :connections:publishToMavenLocal :wear-ui:publishToMavenLocal --no-daemon --stacktrace
          test -f ~/.m2/repository/com/github/cfogrady/nearby/connections/p2p/connections/0.1.0/connections-0.1.0.aar
          test -f ~/.m2/repository/com/github/cfogrady/nearby/connections/p2p/wear-ui/0.1.0/wear-ui-0.1.0.aar
      - name: Patch only physical VB requirements and watch sensors
        run: |
          python3 vitalwear-clean/patch_original.py VitalWear
          python3 vitalwear-clean/check_original.py VitalWear
          python3 vitalwear-clean/fix_crash_081.py VitalWear VitalWearForkSchema
          python3 vitalwear-clean/check_crash_081.py VitalWear VitalWearForkSchema
          python3 vitalwear-clean/package_safe_v082.py VitalWear
      - name: Assemble original-source Wear + companion APKs
        run: |
          cd VitalWear
          chmod +x gradlew
          ./gradlew :app:assembleDebug :companion:assembleDebug --no-daemon --stacktrace
      - name: Verify compiled Room schema compatibility with installed 0.6.x
        run: |
          python3 vitalwear-clean/check_crash_081.py VitalWear VitalWearForkSchema
      - name: Test project unit tests
        run: |
          cd VitalWear
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Collect APKs and verify archive contents
        if: always()
        run: |
          mkdir -p outputs
          if test -f VitalWear/app/build/outputs/apk/debug/app-debug.apk; then
            cp VitalWear/app/build/outputs/apk/debug/app-debug.apk outputs/VitalWear-Watch-Clean-v0.8.2.apk
          fi
          if test -f VitalWear/companion/build/outputs/apk/debug/companion-debug.apk; then
            cp VitalWear/companion/build/outputs/apk/debug/companion-debug.apk outputs/VitalWear-Phone-Clean-v0.8.2.apk
          fi
          if test -f outputs/VitalWear-Watch-Clean-v0.8.2.apk; then
            unzip -t outputs/VitalWear-Watch-Clean-v0.8.2.apk | tail -2
            sha256sum outputs/VitalWear-Watch-Clean-v0.8.2.apk
          fi
          if test -f outputs/VitalWear-Phone-Clean-v0.8.2.apk; then
            unzip -t outputs/VitalWear-Phone-Clean-v0.8.2.apk | tail -2
            sha256sum outputs/VitalWear-Phone-Clean-v0.8.2.apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VitalWear-v082-Clean-Paired-APKs
          path: outputs/*.apk
          retention-days: 30

  phone-launch-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VitalWear-v082-Clean-Paired-APKs
          path: outputs
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Phone APK and check for AndroidRuntime crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            APP="$(find outputs -name 'VitalWear-Phone-Clean-v0.8.2.apk' -print -quit)"
            test -s "$APP"
            adb install -r "$APP"
            adb logcat -c
            adb shell am start -W -n dev.mikeki.vitalwear.gw8.clean/com.github.cfogrady.vitalwear.main.MainActivity
            sleep 8
            adb logcat -d -v time > /tmp/vitalwear-phone-startup.log
            if ! adb shell pidof dev.mikeki.vitalwear.gw8.clean; then
              grep -A 40 -B 2 -E 'FATAL EXCEPTION|AndroidRuntime' /tmp/vitalwear-phone-startup.log | tail -100 || true
              echo "FAIL: Phone process exited after opening"
              exit 1
            fi
            if grep -A 30 'FATAL EXCEPTION' /tmp/vitalwear-phone-startup.log | grep -q dev.mikeki.vitalwear.gw8.clean; then
              grep -A 40 'FATAL EXCEPTION' /tmp/vitalwear-phone-startup.log | tail -100
              echo "FAIL: Phone AndroidRuntime FATAL EXCEPTION"
              exit 1
            fi
            echo "PASS: Phone main activity remains running after launch"

  watch-launch-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VitalWear-v082-Clean-Paired-APKs
          path: outputs
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Watch APK in a Wear OS system image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          script: |
            set -eu
            APP="$(find outputs -name 'VitalWear-Watch-Clean-v0.8.2.apk' -print -quit)"
            test -s "$APP"
            adb install -r "$APP"
            adb logcat -c
            adb shell am start -W -n dev.mikeki.vitalwear.gw8.clean/com.github.cfogrady.vitalwear.main.MainActivity
            sleep 8
            adb logcat -d -v time >/tmp/vitalwear-watch-startup.log
            if ! adb shell pidof dev.mikeki.vitalwear.gw8.clean; then
              grep -A 40 -B 2 -E 'FATAL EXCEPTION|AndroidRuntime' /tmp/vitalwear-watch-startup.log | tail -100 || true
              echo "FAIL: Watch process exited after opening"
              exit 1
            fi
            if grep -A 30 'FATAL EXCEPTION' /tmp/vitalwear-watch-startup.log | grep -q dev.mikeki.vitalwear.gw8.clean; then
              grep -A 40 'FATAL EXCEPTION' /tmp/vitalwear-watch-startup.log | tail -100
              echo "FAIL: Watch AndroidRuntime FATAL EXCEPTION"
              exit 1
            fi
            echo "PASS: Watch main activity remains running after launch"
