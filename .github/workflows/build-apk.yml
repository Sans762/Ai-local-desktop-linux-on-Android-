name: Build Android Native APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Bundle ARM64 Linux runtime and Alpine rootfs
        run: bash tools/fetch-embedded-linux.sh
      - name: Embed noVNC 1.7.0 in the Android APK
        run: bash tools/fetch-novnc.sh
      - name: Configure persistent APK signing when release secrets are available
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/localai-release.jks"
            chmod 600 "$RUNNER_TEMP/localai-release.jks"
            echo "AI_RELEASE_KEYSTORE=$RUNNER_TEMP/localai-release.jks" >> "$GITHUB_ENV"
            echo "AI_RELEASE_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AI_RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AI_RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "AI_APK_KIND=release" >> "$GITHUB_ENV"
            echo "Persistent release signing enabled"
          else
            echo "AI_APK_KIND=debug" >> "$GITHUB_ENV"
            echo "::warning::No persistent release signing secrets. This debug APK may NOT update prior APKs in place; do not uninstall an app containing data without first backing it up."
          fi
      - name: Check mobile layouts and JavaScript syntax
        shell: bash
        run: python3 tests/test_ui_layout_contract.py
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AI_APK_KIND" == release ]]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
            echo "AI_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
            echo "AI_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Verify package is Linux-only
        shell: bash
        run: |
          set -euo pipefail
          APK="$AI_APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep -q 'assets/desktop.html'
          unzip -l "$APK" | grep -q 'assets/novnc/core/rfb.js'
          unzip -l "$APK" | grep -q 'assets/novnc/vendor/pako/lib/zlib/inflate.js'
          unzip -l "$APK" | grep -q 'assets/alpine-rootfs.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot.so'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "BackupService"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "LinuxInstallService"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "AppUpdateDownloadService"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "FileProvider"
          unzip -l "$APK" | grep -q 'assets/app.js'
          unzip -l "$APK" | grep -q 'res/'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/linux-only-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE_MEDIA_PROJECTION|android.accessibilityservice|ScreenShareService|AutomationAccessibilityService' /tmp/linux-only-manifest.txt; then
            echo "Unexpected Android remote control declaration found"
            exit 1
          fi
          if [[ "$AI_APK_KIND" == release ]]; then
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.localai.linuxagent.desktop'"
          else
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.localai.linuxagent.desktop.test.v012'"
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LocalAI-LinuxDesktop-v0.12-APK
          path: ${{ env.AI_APK }}
          if-no-files-found: error

      - name: Publish direct-download standalone APK
        if: github.ref == 'refs/heads/main' && env.AI_APK_KIND == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "Stale workflow commit; do not publish an older APK over the latest build."
            exit 0
          fi
          cp "$AI_APK" LocalAI-LinuxDesktop-v0.12-signed-ARM64.apk
          if gh release view v0.12-linux-desktop >/dev/null 2>&1; then
            gh release upload v0.12-linux-desktop LocalAI-LinuxDesktop-v0.12-signed-ARM64.apk --clobber
          else
            gh release create v0.12-linux-desktop LocalAI-LinuxDesktop-v0.12-signed-ARM64.apk \
              --target "$GITHUB_SHA" \
              --title "Local AI Linux Desktop v0.12 - ARM64" \
              --notes "Linux Desktop v0.12: persistent owner-controlled release signature, same Android package as v0.6, update checker, Openbox, PC VNC and AI web. Existing debug builds signed with a different key cannot be updated in place. Back up app data before migration; no Android device test has been completed."
          fi
      - name: Publish debug test APK as GitHub prerelease (not an in-place upgrade)
        if: github.ref == 'refs/heads/main' && env.AI_APK_KIND == 'debug'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "Stale workflow commit; do not publish an older APK over the latest build."
            exit 0
          fi
          cp "$AI_APK" LocalAI-LinuxDesktop-v0.12-Verified-TEST-ARM64.apk
          if gh release view v0.12-verified-test >/dev/null 2>&1; then
            gh release upload v0.12-verified-test LocalAI-LinuxDesktop-v0.12-Verified-TEST-ARM64.apk --clobber
          else
            gh release create v0.12-verified-test LocalAI-LinuxDesktop-v0.12-Verified-TEST-ARM64.apk \
              --prerelease --target "$GITHUB_SHA" \
              --title "Local AI Linux Desktop v0.12 COMPACT UI TEST - ARM64" \
              --notes "Compact UI TEST APK: fixed Android 17 edge-to-edge status bar overlap, replaced oversized welcome screen with compact status, single-line four-step checklist and five color-coded category buttons. Selected settings category shows only its relevant controls. Includes local AI, Linux desktop, noVNC, monitor and signed in-app update checker. Installs separately as TEST v0.12 to preserve previous app data. Android device E2E verification and persistent signing are still incomplete."
          fi
          EXPECTED="sha256:$(sha256sum "$AI_APK" | awk '{print $1}')"
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.12-verified-test" \
            --jq '.assets[] | select(.name=="LocalAI-LinuxDesktop-v0.12-Verified-TEST-ARM64.apk") | .digest')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Published APK SHA-256 mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          echo "Published APK SHA-256 verified: $EXPECTED"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/localai-release.jks"
