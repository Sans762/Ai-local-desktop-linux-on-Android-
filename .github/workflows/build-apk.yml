name: Build Android Native APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android 36 SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' || true
      - name: Build unsigned debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAiNative-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error