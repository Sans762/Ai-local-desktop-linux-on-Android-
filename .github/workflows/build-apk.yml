name: Build Android Native APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Bundle ARM64 Linux runtime and Alpine rootfs
        run: bash tools/fetch-embedded-linux.sh
      - name: Embed noVNC 1.7.0 in the Android APK
        run: bash tools/fetch-novnc.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify package is Linux-only
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/linux-only-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE_MEDIA_PROJECTION|android.accessibilityservice|ScreenShareService|AutomationAccessibilityService' /tmp/linux-only-manifest.txt; then
            echo "Unexpected Android remote control declaration found"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.localai.linuxagent.desktop'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LocalAI-LinuxDesktop-v0.6-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish direct-download standalone APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk LocalAI-LinuxDesktop-v0.6-ARM64.apk
          if gh release view v0.6-linux-desktop >/dev/null 2>&1; then
            gh release upload v0.6-linux-desktop LocalAI-LinuxDesktop-v0.6-ARM64.apk --clobber
          else
            gh release create v0.6-linux-desktop LocalAI-LinuxDesktop-v0.6-ARM64.apk \
              --target "$GITHUB_SHA" \
              --title "Local AI Linux Desktop v0.6 - ARM64" \
              --notes "Alpine Linux graphical Openbox desktop in Android, built-in noVNC touch viewer, VNC for PCs over trusted LAN/VPN, authenticated local and LAN AI Web UI. Linux-only: no Android Accessibility or screen capture. Install Linux desktop packages and GGUF model separately. Runtime device testing is required."
          fi
