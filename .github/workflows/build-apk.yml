name: Build Android Native APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Bundle ARM64 Linux runtime and Alpine rootfs
        run: bash tools/fetch-embedded-linux.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LocalAiNative-v0.4-Linux-AI-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish direct-download standalone APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk LocalAI-Native-v0.4-Android-ARM64.apk
          if gh release view v0.4-linux-ai >/dev/null 2>&1; then
            gh release upload v0.4-linux-ai LocalAI-Native-v0.4-Android-ARM64.apk --clobber
          else
            gh release create v0.4-linux-ai LocalAI-Native-v0.4-Android-ARM64.apk \
              --target "$GITHUB_SHA" \
              --title "Local AI Native v0.4 - Android ARM64" \
              --notes "Standalone APK, no ZIP extraction or Termux required. Includes offline GGUF engine and Alpine Linux/PRoot payload. AI weights download separately. Runtime behavior still needs device testing."
          fi
