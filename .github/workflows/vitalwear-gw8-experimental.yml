name: VitalWear Galaxy Watch 8 experimental APKs
on:
  push:
    branches:
      - experimental/vitalwear-gw8-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build platforms
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Source checkout
        run: |
          git clone --depth 1 https://github.com/457R0/VitalWear.git VitalWear
          git clone --depth 1 --branch java8 https://github.com/cfogrady/VB-DIM-Reader.git VB-DIM-Reader-2.0.0
      - name: Prepare required VB-DIM-Reader library
        run: |
          cd VB-DIM-Reader-2.0.0
          chmod +x gradlew
          ./gradlew clean jar --no-daemon --stacktrace
          mkdir -p build/libs
          find build/libs -type f -name '*.jar' -print
          cp "$(find build/libs -type f -name '*.jar' ! -name '*sources*' | head -1)" build/libs/VB-DIM-Reader.jar
      - name: Patch standalone experiment
        run: |
          python vitalwear-gw8/patch_project.py VitalWear
          python vitalwear-gw8/fix_direct_import.py VitalWear
          python vitalwear-gw8/fix_steps_heart.py VitalWear
          python vitalwear-gw8/add_sensor_screen.py VitalWear
          python vitalwear-gw8/add_vb_ux_sound.py VitalWear
          python vitalwear-gw8/add_game_face_data.py VitalWear
          python vitalwear-gw8/add_live_background.py VitalWear
          python vitalwear-gw8/add_all_menu_bezel.py VitalWear
          python vitalwear-gw8/real_game_ui.py VitalWear
          python vitalwear-gw8/fix_vbhelper_return.py VitalWear
          python vitalwear-gw8/confirm_nfc_before_ack.py VitalWear
          python -m pip install --quiet pillow
          python vitalwear-gw8/make_real_face.py
          python vitalwear-gw8/make_face_custom_full.py
      - name: Validate WFF4 with official Google validator
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google/watchface.git /tmp/google-watchface
          git -C /tmp/google-watchface sparse-checkout set third_party/wff
          cd /tmp/google-watchface/third_party/wff
          chmod +x gradlew
          ./gradlew :specification:validator:executable-jar --no-daemon
          java -jar specification/validator/build/libs/wff-validator.jar 4 "$GITHUB_WORKSPACE/VBClassicXLFace/src/main/res/raw/watchface.xml"
      - name: Build WFF VB Classic XL face APK
        run: |
          cd VBClassicXLFace
          ../VitalWear/gradlew assembleDebug --no-daemon --stacktrace
      - name: Build watch and phone experimental APKs
        run: |
          cd VitalWear
          chmod +x gradlew
          ./gradlew :app:assembleDebug :companion:assembleDebug --no-daemon --stacktrace
      - name: Collect and inspect outputs
        if: always()
        run: |
          mkdir -p outputs
          if test -f VitalWear/app/build/outputs/apk/debug/app-debug.apk; then cp VitalWear/app/build/outputs/apk/debug/app-debug.apk outputs/VitalWear-GW8-Watch-EXPERIMENT.apk; fi
          if test -f VitalWear/companion/build/outputs/apk/debug/companion-debug.apk; then cp VitalWear/companion/build/outputs/apk/debug/companion-debug.apk outputs/VitalWear-GW8-Phone-EXPERIMENT.apk; fi
          if test -f VBClassicXLFace/build/outputs/apk/debug/VBClassicXLFace-debug.apk; then cp VBClassicXLFace/build/outputs/apk/debug/VBClassicXLFace-debug.apk outputs/VBClassicXL-Face-EXPERIMENT.apk; fi
          test -f outputs/VitalWear-GW8-Watch-EXPERIMENT.apk
          test -f outputs/VitalWear-GW8-Phone-EXPERIMENT.apk
          test -f outputs/VBClassicXL-Face-EXPERIMENT.apk
          for a in outputs/*.apk; do
            test -f "$a" || continue
            echo "$a"
            unzip -t "$a" | tail -2
            sha256sum "$a"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VitalWear-GW8-Experimental-APKs
          path: outputs/*.apk
          retention-days: 30
