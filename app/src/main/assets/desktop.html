<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070e20">
<title>Linux Desktop · Local AI</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-width:0;max-width:100%;height:var(--viewer-height,100dvh);min-height:0;overflow:hidden;background:#060b18;color:#f2f5ff}
body{display:flex;flex-direction:column}
header{height:38px;flex:0 0 38px;min-width:0;display:flex;align-items:center;gap:10px;padding:3px 9px;background:#101a30;border-bottom:1px solid #273958}
.brand{min-width:0;flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#92e2c5}
button,input,textarea{font:inherit;font-size:13px;border-radius:10px}
button{background:#253352;color:#f2f5ff;border:1px solid #3b4e78;padding:8px 10px;min-height:37px;cursor:pointer}
button.primary{background:linear-gradient(110deg,#586aef,#8b55d1);border:0;font-weight:700}
#manualOptions{flex:0 0 auto;position:relative}
#manualOptions summary{cursor:pointer;list-style:none;background:#202d49;border-radius:9px;padding:6px 12px;font-size:17px;min-width:35px;text-align:center}
#manualOptions summary::-webkit-details-marker{display:none}
#manualMenu{z-index:15;position:absolute;top:39px;right:0;width:min(280px,calc(100vw - 18px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:8px;background:#121d37;border:1px solid #445480;border-radius:13px;box-shadow:0 12px 30px #0009}
#manualMenu button{min-width:0;font-size:12px}
#manualMenu button[aria-pressed="true"]{background:#6659c9;border-color:#a99aff}
main{display:flex;flex:1 1 auto;min-height:0;min-width:0;flex-direction:column;padding:4px;overflow:hidden}
#authBar{display:flex;gap:5px;margin:2px 0 5px;flex:0 0 auto}
#authBar input{min-width:0;flex:1;border:1px solid #3c4d74;background:#131e36;color:#fff;padding:8px 11px;font-size:16px;min-height:42px}
#authBar button{flex:0 0 auto;min-width:95px}
#viewport{flex:1 1 auto;position:relative;min-height:0;min-width:0;width:100%;background:#050711;border:1px solid #283852;border-radius:8px;overflow:hidden}
#screen{min-height:0;width:100%;height:100%;touch-action:none;overflow:hidden}
#screen canvas{max-width:100%;max-height:100%}
#cover{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#cover .inside{background:#111b32e8;color:#dbe5ff;border-radius:14px;border:1px solid #34456f;text-align:center;padding:17px;max-width:290px;margin:10px}
#cover strong{font-size:16px}
#cover p{font-size:12px;line-height:1.5;color:#abbdd9;margin:8px 0 0}
#hint{display:none;color:#9db5d4;font-size:11px;margin:3px 2px 0}
#linuxKeyboard{display:none;min-width:0;flex:0 0 auto;width:100%;min-height:42px;max-height:90px;resize:none;border:1px solid #6259b5;padding:9px 10px;margin-top:4px;background:#13203b;color:#fff;font-size:16px}
#linuxKeyboard.visible{display:block}
#touchpadArea{position:absolute;inset:0;display:none;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
#touchpadArea.active{display:block}
#virtualCursor{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:#a4b0ffbb;border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none}
#exitFull{display:none;position:absolute;right:5px;top:5px;z-index:8;min-height:30px;background:#26304de8;font-size:12px}
body.immersive header{display:none}
body.immersive main{padding:0}
body.immersive #exitFull{display:block}
body.immersive #viewport{border-radius:0}
[hidden]{display:none!important}
@media(max-height:400px){header{height:31px;flex-basis:31px}#authBar input{min-height:35px}#authBar button{min-height:35px}main{padding:2px}}
@media(max-width:350px){#status{max-width:37%;font-size:10px}.brand{font-size:12px}}
</style></head><body>
<header><span class="brand">▣ Linux Desktop</span><span id="status">กำลังเตรียมหน้าจอ…</span>
<details id="manualOptions"><summary aria-label="เครื่องมือเพิ่มเติม">⋯</summary>
<div id="manualMenu">
<button id="trackpad" aria-pressed="false">◉ Trackpad</button>
<button id="keyboard">⌨ คีย์บอร์ด</button>
<button id="rightClick">คลิกขวา</button>
<button id="dragMode" aria-pressed="false">ลาก: ปิด</button>
<button id="cad">Ctrl+Alt+Del</button>
<button id="disconnect">ตัดการเชื่อมต่อ</button>
<button id="full">เต็มจอ</button>
</div></details></header>
<main>
<div id="authBar">
<input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="รหัส VNC 6–8 ตัว" maxlength="8" aria-label="รหัส VNC">
<button class="primary" id="connect" disabled>เชื่อมต่อ</button>
</div>
<div id="viewport">
<div id="screen"></div>
<div id="touchpadArea" aria-label="พื้นที่ Trackpad"><div id="virtualCursor"></div></div>
<button id="exitFull">ออกเต็มจอ</button>
<div id="cover"><div class="inside"><strong>Linux Desktop</strong><p>ใส่รหัส VNC แล้วกดเชื่อมต่อ<br>AI สามารถสั่งงาน Linux ผ่านช่องคำสั่งในแอปได้</p></div></div>
</div>
<textarea id="linuxKeyboard" rows="1" placeholder="พิมพ์เข้า Linux" aria-label="คีย์บอร์ด Linux"
 autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
<p id="hint">เดสก์ท็อป Linux ภายในมือถือ</p>
</main>
<script>
window.addEventListener('error', event => {
  window.localaiViewerError = event.message || 'โหลดตัวดูจอไม่สำเร็จ';
  const status = document.getElementById('status');
  if (status) status.textContent = 'เปิดตัวดูจอไม่สำเร็จ';
});
</script>
<script type="module">
import RFB from '/novnc/core/rfb.js';
let rfb = null;

function fitViewer() {
  const viewport = window.visualViewport;
  const height = Math.floor(viewport && viewport.scale === 1 ? viewport.height : window.innerHeight);
  if (height > 80 && Number.isFinite(height)) {
    document.body.style.setProperty('--viewer-height', height + 'px');
  }
}
fitViewer();
window.addEventListener('resize', fitViewer);
window.addEventListener('orientationchange', fitViewer);
window.visualViewport?.addEventListener('resize', fitViewer);

const el = id => document.getElementById(id);
const status = text => el('status').textContent=text;
el('connect').addEventListener('click', () => {
  if(rfb){try{rfb.disconnect();}catch(_){}rfb=null;}
  const password=el('password').value;
  if(!/^[A-Za-z0-9]{6,8}$/.test(password)){status('ใส่รหัส VNC 6–8 ตัว');return;}
  status('กำลังเชื่อมต่อ…');
  try {
    rfb = new RFB(el('screen'), 'ws://127.0.0.1:6080/ws', {credentials:{password}});
    rfb.scaleViewport=true; rfb.resizeSession=false; rfb.focusOnClick=true;
    rfb.addEventListener('connect', () => {
      status('● เชื่อมต่อแล้ว');
      el('cover').hidden=true;
      el('authBar').hidden=true;
      el('password').value='';
    });
    rfb.addEventListener('disconnect', e => {
      status(e.detail.clean?'ไม่ได้เชื่อมต่อ':'เชื่อมต่อไม่ได้');
      el('cover').hidden=false;el('authBar').hidden=false;
      setTrackpad(false);input.blur();input.classList.remove('visible');
    });
    rfb.addEventListener('credentialsrequired', () => {
      const credential=el('password').value || window.prompt('ใส่รหัส VNC') || '';
      rfb.sendCredentials({password:credential});
    });
  } catch(e){status(e.message);}
});
// The trackpad sends mouse input to noVNC's canvas at a relative cursor.
let trackpadMode=false, holding=false, virtualX=0.50, virtualY=0.50;
let previousX=0,previousY=0,tapDistance=0,twoFinger=false;
const pad=el('touchpadArea'),dot=el('virtualCursor'),input=el('linuxKeyboard');
function canvas(){return el('screen').querySelector('canvas');}
function cursorPoint(){
  const box=(canvas()||el('screen')).getBoundingClientRect();
  return {x:box.left+box.width*virtualX,y:box.top+box.height*virtualY};
}
function mouse(type,button=0){
  const node=canvas();if(!node||!rfb)return;
  const p=cursorPoint();
  const bit=button===2?2:1;
  node.dispatchEvent(new MouseEvent(type,{bubbles:true,cancelable:true,
    view:window,clientX:p.x,clientY:p.y,button,
    buttons:type==='mouseup'?0:type==='mousedown'?bit:holding?1:0}));
}
function releaseCapture(){
  const proxy=document.getElementById('noVNC_mouse_capture_elem');
  if(proxy)proxy.style.display='none';
}
function click(button=0){
  mouse('mousemove');mouse('mousedown',button);mouse('mouseup',button);releaseCapture();
}
function refreshCursor(){
  dot.style.left=(virtualX*100)+'%';dot.style.top=(virtualY*100)+'%';
}
function setTrackpad(enabled){
  if(holding){mouse('mouseup');holding=false;releaseCapture();}
  trackpadMode=enabled;
  pad.classList.toggle('active',enabled);
  el('trackpad').setAttribute('aria-pressed',String(enabled));
  el('trackpad').textContent=enabled?'✓ Trackpad':'◉ Trackpad';
  el('dragMode').textContent='ลาก: ปิด';
  el('dragMode').setAttribute('aria-pressed','false');
  refreshCursor();
}
el('trackpad').addEventListener('click',()=>{
  if(!rfb){status('เชื่อมต่อ Linux ก่อน');return;}
  setTrackpad(!trackpadMode);
});
pad.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!rfb)return;
  const t=e.touches[0];if(!t)return;
  previousX=t.clientX;previousY=t.clientY;tapDistance=0;
  twoFinger=e.touches.length>1;
},{passive:false});
pad.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!rfb)return;
  const t=e.touches[0];if(!t)return;
  const dx=t.clientX-previousX,dy=t.clientY-previousY;
  previousX=t.clientX;previousY=t.clientY;
  tapDistance+=Math.abs(dx)+Math.abs(dy);
  if(e.touches.length>1){
    twoFinger=true;
    const node=canvas();
    if(node){
      const p=cursorPoint();
      node.dispatchEvent(new WheelEvent('wheel',{
        bubbles:true,cancelable:true,clientX:p.x,clientY:p.y,deltaY:-dy*2}));
    }
    return;
  }
  const box=(canvas()||pad).getBoundingClientRect();
  if(box.width<1||box.height<1)return;
  virtualX=Math.max(0.005,Math.min(0.995,virtualX+1.5*dx/box.width));
  virtualY=Math.max(0.005,Math.min(0.995,virtualY+1.5*dy/box.height));
  refreshCursor();
  mouse('mousemove');
},{passive:false});
pad.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!rfb||e.touches.length>0)return;
  if(!holding&&tapDistance<12)click(twoFinger?2:0);
},{passive:false});
el('rightClick').addEventListener('click',()=>{if(rfb)click(2);});
el('dragMode').addEventListener('click',()=>{
  if(!rfb||!trackpadMode){status('เปิด Trackpad ก่อน');return;}
  holding=!holding;
  mouse(holding?'mousedown':'mouseup',0);
  if(!holding)releaseCapture();
  el('dragMode').textContent=holding?'ลาก: เปิด':'ลาก: ปิด';
  el('dragMode').setAttribute('aria-pressed',String(holding));
});
let composing=false;
function typeText(value){
  if(!rfb||!value)return;
  for(const char of value){
    const cp=char.codePointAt(0);
    rfb.sendKey(cp<=255?cp:0x01000000+cp,null);
  }
}
function flush(){
  if(composing||!input.value)return;
  typeText(input.value);input.value='';
}
input.addEventListener('compositionstart',()=>{composing=true;});
input.addEventListener('compositionend',()=>{composing=false;flush();});
input.addEventListener('input',flush);
input.addEventListener('beforeinput',e=>{
  if(e.inputType==='deleteContentBackward'&&!input.value&&rfb){
    e.preventDefault();rfb.sendKey(0xff08,'Backspace');
  }
});
input.addEventListener('keydown',e=>{
  if(!rfb)return;
  if(e.key==='Enter'){e.preventDefault();flush();rfb.sendKey(0xff0d,'Enter');}
  if(e.key==='Tab'){e.preventDefault();rfb.sendKey(0xff09,'Tab');}
});
el('keyboard').addEventListener('click',()=>{
  if(!rfb){status('เชื่อมต่อ Linux ก่อน');return;}
  const visible=input.classList.toggle('visible');
  el('keyboard').textContent=visible?'ซ่อนคีย์บอร์ด':'⌨ คีย์บอร์ด';
  if(visible)input.focus();else{input.blur();rfb.focus();}
  fitViewer();
});
function fullScreenMode(off=false){
  const enabled=!off&&!document.body.classList.contains('immersive');
  document.body.classList.toggle('immersive',enabled);
  el('full').textContent=enabled?'ออกเต็มจอ':'เต็มจอ';
  fitViewer();
}
el('disconnect').addEventListener('click',()=>{if(rfb)rfb.disconnect();});

el('cad').addEventListener('click',()=>{if(rfb)rfb.sendCtrlAltDel();});
el('full').addEventListener('click',()=>fullScreenMode());
el('exitFull').addEventListener('click',()=>fullScreenMode(true));
window.addEventListener('pagehide',()=>{if(rfb)rfb.disconnect();});
el('connect').disabled=false;
status('พร้อมเชื่อมต่อ');
</script></body></html>
