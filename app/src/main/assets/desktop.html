<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070e20">
<title>Linux Desktop · Local AI</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#070e20;color:#edf2ff}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;background:#101b35;border-bottom:1px solid #2b385d}
.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(125deg,#7274ff,#59cbbb);font-size:21px}
.brand strong{display:block;font-size:15px}.brand small{display:block;color:#95a7c9;font-size:10px;letter-spacing:.14em}
#status{font-size:11px;border:1px solid #3c4b70;background:#172440;border-radius:99px;padding:6px 10px;color:#b9c9e8}
main{padding:12px;max-width:1400px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
button,input{font:inherit;border-radius:10px}button{border:1px solid #5365a6;padding:9px 13px;color:#edf2ff;background:#263458;cursor:pointer}button.primary{background:linear-gradient(100deg,#6676f0,#735ec4);border:0;font-weight:700}
input{padding:10px 11px;background:#101d34;border:1px solid #3b4d72;color:#fff;width:180px;min-width:0}
#viewport{background:#030812;border:1px solid #2b3d65;border-radius:16px;position:relative;overflow:hidden;min-height:0}
#screen{width:100%;height:calc(100dvh - 170px);min-height:0;touch-action:none}
#screen canvas{max-width:100%}#hint{color:#a8bcdb;font-size:12px;margin:10px 3px 4px}
#cover{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#cover .inside{background:#121f3c;border:1px solid #32436a;border-radius:20px;padding:23px;text-align:center;max-width:380px;margin:12px}
#cover strong{display:block;font-size:19px;margin-bottom:10px}#cover p{line-height:1.6;color:#afc0dd;font-size:13px}
@media(max-width:630px){main{padding:7px}.toolbar{gap:6px}input{flex:1;min-width:120px}button{padding:9px 11px;font-size:13px}#viewport{border-radius:9px}#screen{height:calc(100dvh - 190px)}}

/* Fit the entire desktop viewer inside Android WebView at any orientation. */
html,body{width:100%;max-width:100%;min-width:0;overflow:hidden}
body{height:var(--viewer-height,100dvh);min-height:0;display:flex;flex-direction:column}
header{flex:0 0 auto;min-width:0}
.brand{min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.brand strong,.brand small{display:block;white-space:normal;overflow-wrap:anywhere}
#status{min-width:0;max-width:44vw;flex:0 1 auto;overflow-wrap:anywhere;text-align:center;line-height:1.3}
main{width:100%;max-width:1400px;min-width:0;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden}
.toolbar{min-width:0;flex:0 0 auto;max-width:100%;align-items:stretch}
.toolbar>button{white-space:normal;overflow-wrap:anywhere;min-width:0}
.toolbar>input{min-width:0}
#viewport{width:100%;min-width:0;min-height:0;height:auto;flex:1 1 auto;overflow:hidden}
#screen{height:100%;min-height:0;width:100%;max-width:100%;overflow:hidden}
#screen canvas{max-width:100%;max-height:100%}
#cover .inside{max-width:min(380px,calc(100vw - 42px));padding:clamp(12px,3vw,23px)}
#hint{flex:0 0 auto;overflow-wrap:anywhere}
[hidden]{display:none!important}
@media(max-width:630px){
  header{padding:7px 9px}
  .brand{gap:7px}
  .mark{width:30px;height:30px;flex-shrink:0}
  .brand strong{font-size:13px}
  .brand small{font-size:8px;letter-spacing:.7px}
  #status{max-width:38vw;font-size:10px;padding:5px 7px}
  main{padding:5px 6px}
  .toolbar{gap:5px;margin-bottom:6px;display:grid;grid-template-columns:minmax(0,1fr) repeat(2,minmax(0,auto))}
  .toolbar input{width:100%;grid-column:1/2;min-height:40px}
  .toolbar #connect{grid-column:2/4}
  .toolbar #disconnect,.toolbar #cad,.toolbar #full{grid-row:auto}
  .toolbar button{min-height:37px;padding:7px 9px;font-size:11px}
  #viewport{border-radius:8px}
  #hint{font-size:10px;margin:5px 2px 1px}
}
@media(max-width:350px){
 .toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}
 .toolbar input{grid-column:1/3}
 .toolbar #connect{grid-column:1/3}
 .toolbar button{white-space:normal}
 .brand small{display:none}
}
@media(max-height:510px){
 header{padding-block:4px}
 main{padding:4px 7px}
 #hint{display:none}
 .toolbar{margin-bottom:4px;gap:4px}
 .toolbar button,.toolbar input{min-height:31px;padding:5px 7px}
}

@media(max-height:350px){
  .toolbar{grid-template-columns:minmax(0,1fr) auto;gap:4px}
  .toolbar input{grid-column:1;min-height:33px}
  .toolbar #connect{grid-column:2;min-height:33px}
  .toolbar #disconnect,.toolbar #cad,.toolbar #full{display:none}
  #hint{display:none}
  #cover .inside{padding:8px;font-size:11px}
  #cover .inside p{font-size:10px;line-height:1.3}
  #cover strong{font-size:13px;margin-bottom:3px}
}

/* Large, scroll-free Linux canvas and minimal mobile control strip. */
#touchControls{display:flex;gap:5px;margin:0 0 6px;flex:0 0 auto}
#touchControls button{flex:1 1 auto;padding:7px 5px;min-height:38px;font-size:12px;white-space:nowrap}
#touchControls [aria-pressed="true"]{background:linear-gradient(100deg,#666cea,#7759be);border-color:#aaa8ff}
#linuxKeyboard{display:none;flex:0 0 auto;min-height:44px;width:100%;border:1px solid #7774ce;border-radius:10px;background:#172443;color:#fff;margin:0 0 5px;padding:10px;font-size:16px;resize:none}
#linuxKeyboard.visible{display:block}
#touchpadArea{position:absolute;z-index:5;inset:0;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#touchpadArea.active{display:block}
#virtualCursor{position:absolute;left:50%;top:50%;width:17px;height:17px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;background:#736bdeba;pointer-events:none;box-shadow:0 0 5px #000}
#exitFull{position:absolute;top:4px;right:4px;z-index:8;display:none;background:#202c58e8}
body.immersive header,body.immersive .toolbar,body.immersive #hint{display:none}
body.immersive main{padding:2px}
body.immersive #viewport{border-radius:3px}
body.immersive #exitFull{display:block}
@media(max-width:630px){#touchControls{gap:3px}#touchControls button{padding:7px 3px;font-size:11px;min-width:0}}
</style></head><body>
<header><div class="brand"><span class="mark">✦</span><div><strong>Linux Desktop</strong><small>ALPINE · OPENBOX · LOCAL AI</small></div></div><span id="status">ไม่ได้เชื่อมต่อ</span></header>
<main><div class="toolbar">
<input id="password" type="password" autocomplete="off" placeholder="รหัสผ่าน VNC 8 ตัวแรก" maxlength="8" aria-label="VNC password">
<button class="primary" id="connect">เชื่อมต่อ</button>
<button id="disconnect">หยุดดู</button>
<button id="cad">Ctrl+Alt+Del</button>
<button id="full">เต็มจอ</button>
</div>
<div id="touchControls" role="toolbar" aria-label="ควบคุม Linux Desktop">
<button id="trackpad" aria-pressed="false">◉ Trackpad</button>
<button id="keyboard">⌨ คีย์บอร์ด</button>
<button id="rightClick">คลิกขวา</button>
<button id="dragMode" aria-pressed="false">ลาก: ปิด</button>
</div>
<textarea id="linuxKeyboard" rows="1" placeholder="พิมพ์ข้อความลง Linux"
autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="แป้นพิมพ์ Linux"></textarea>
<div id="viewport"><button id="exitFull">ออกเต็มจอ</button>
<div id="screen"></div><div id="touchpadArea" aria-label="พื้นที่ Trackpad"><div id="virtualCursor"></div></div><div id="cover"><div class="inside"><strong>Linux Desktop ของคุณ</strong><p>เริ่ม Linux Desktop ใน Control Center ก่อน จากนั้นใส่รหัสผ่าน VNC และเชื่อมต่อเพื่อใช้งานหน้าจอ Linux ได้จริง</p></div></div></div>
<p id="hint">Linux ในมือถือ · แตะจอเพื่อคลิก หรือเลือก Trackpad/คีย์บอร์ด</p>
</main>
<script type="module">
import RFB from '/novnc/core/rfb.js';
let rfb = null;

function fitViewer() {
  const viewport = window.visualViewport;
  const height = Math.floor(viewport && viewport.scale === 1 ? viewport.height : window.innerHeight);
  if (height > 80 && Number.isFinite(height)) {
    document.body.style.setProperty('--viewer-height', height + 'px');
  }
}
fitViewer();
window.addEventListener('resize', fitViewer);
window.addEventListener('orientationchange', fitViewer);
window.visualViewport?.addEventListener('resize', fitViewer);

const el = id => document.getElementById(id);
const status = text => el('status').textContent=text;
el('connect').addEventListener('click', () => {
  if(rfb){try{rfb.disconnect();}catch(_){}rfb=null;}
  const password=el('password').value;
  if(!password){status('กรุณากรอกรหัส VNC');return;}
  status('กำลังเชื่อมต่อ…');
  try {
    rfb = new RFB(el('screen'), 'ws://127.0.0.1:6080/ws', {credentials:{password}});
    rfb.scaleViewport=true; rfb.resizeSession=false; rfb.focusOnClick=true;
    rfb.addEventListener('connect', () => {status('เชื่อมต่อ Linux แล้ว');el('cover').hidden=true;el('password').value='';});
    rfb.addEventListener('disconnect', e => {status(e.detail.clean?'ตัดการเชื่อมต่อ':'เชื่อมต่อไม่ได้ ตรวจว่า Desktop เปิดอยู่');el('cover').hidden=false;setTrackpad(false);input.blur();input.classList.remove('visible');});
    rfb.addEventListener('credentialsrequired', () => {
      const credential=el('password').value || window.prompt('ใส่รหัส VNC') || '';
      rfb.sendCredentials({password:credential});
    });
  } catch(e){status(e.message);}
});
// The trackpad sends mouse input to noVNC's canvas at a relative cursor.
let trackpadMode=false, holding=false, virtualX=0.50, virtualY=0.50;
let previousX=0,previousY=0,tapDistance=0,twoFinger=false;
const pad=el('touchpadArea'),dot=el('virtualCursor'),input=el('linuxKeyboard');
function canvas(){return el('screen').querySelector('canvas');}
function cursorPoint(){
  const box=(canvas()||el('screen')).getBoundingClientRect();
  return {x:box.left+box.width*virtualX,y:box.top+box.height*virtualY};
}
function mouse(type,button=0){
  const node=canvas();if(!node||!rfb)return;
  const p=cursorPoint();
  const bit=button===2?2:1;
  node.dispatchEvent(new MouseEvent(type,{bubbles:true,cancelable:true,
    view:window,clientX:p.x,clientY:p.y,button,
    buttons:type==='mouseup'?0:type==='mousedown'?bit:holding?1:0}));
}
function releaseCapture(){
  const proxy=document.getElementById('noVNC_mouse_capture_elem');
  if(proxy)proxy.style.display='none';
}
function click(button=0){
  mouse('mousemove');mouse('mousedown',button);mouse('mouseup',button);releaseCapture();
}
function refreshCursor(){
  dot.style.left=(virtualX*100)+'%';dot.style.top=(virtualY*100)+'%';
}
function setTrackpad(enabled){
  if(holding){mouse('mouseup');holding=false;releaseCapture();}
  trackpadMode=enabled;
  pad.classList.toggle('active',enabled);
  el('trackpad').setAttribute('aria-pressed',String(enabled));
  el('trackpad').textContent=enabled?'✓ Trackpad':'◉ Trackpad';
  el('dragMode').textContent='ลาก: ปิด';
  el('dragMode').setAttribute('aria-pressed','false');
  refreshCursor();
}
el('trackpad').addEventListener('click',()=>{
  if(!rfb){status('เชื่อมต่อ Linux ก่อน');return;}
  setTrackpad(!trackpadMode);
});
pad.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!rfb)return;
  const t=e.touches[0];if(!t)return;
  previousX=t.clientX;previousY=t.clientY;tapDistance=0;
  twoFinger=e.touches.length>1;
},{passive:false});
pad.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!rfb)return;
  const t=e.touches[0];if(!t)return;
  const dx=t.clientX-previousX,dy=t.clientY-previousY;
  previousX=t.clientX;previousY=t.clientY;
  tapDistance+=Math.abs(dx)+Math.abs(dy);
  if(e.touches.length>1){
    twoFinger=true;
    const node=canvas();
    if(node){
      const p=cursorPoint();
      node.dispatchEvent(new WheelEvent('wheel',{
        bubbles:true,cancelable:true,clientX:p.x,clientY:p.y,deltaY:-dy*2}));
    }
    return;
  }
  const box=(canvas()||pad).getBoundingClientRect();
  if(box.width<1||box.height<1)return;
  virtualX=Math.max(0.005,Math.min(0.995,virtualX+1.5*dx/box.width));
  virtualY=Math.max(0.005,Math.min(0.995,virtualY+1.5*dy/box.height));
  refreshCursor();
  mouse('mousemove');
},{passive:false});
pad.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!rfb||e.touches.length>0)return;
  if(!holding&&tapDistance<12)click(twoFinger?2:0);
},{passive:false});
el('rightClick').addEventListener('click',()=>{if(rfb)click(2);});
el('dragMode').addEventListener('click',()=>{
  if(!rfb||!trackpadMode){status('เปิด Trackpad ก่อน');return;}
  holding=!holding;
  mouse(holding?'mousedown':'mouseup',0);
  if(!holding)releaseCapture();
  el('dragMode').textContent=holding?'ลาก: เปิด':'ลาก: ปิด';
  el('dragMode').setAttribute('aria-pressed',String(holding));
});
let composing=false;
function typeText(value){
  if(!rfb||!value)return;
  for(const char of value){
    const cp=char.codePointAt(0);
    rfb.sendKey(cp<=255?cp:0x01000000+cp,null);
  }
}
function flush(){
  if(composing||!input.value)return;
  typeText(input.value);input.value='';
}
input.addEventListener('compositionstart',()=>{composing=true;});
input.addEventListener('compositionend',()=>{composing=false;flush();});
input.addEventListener('input',flush);
input.addEventListener('beforeinput',e=>{
  if(e.inputType==='deleteContentBackward'&&!input.value&&rfb){
    e.preventDefault();rfb.sendKey(0xff08,'Backspace');
  }
});
input.addEventListener('keydown',e=>{
  if(!rfb)return;
  if(e.key==='Enter'){e.preventDefault();flush();rfb.sendKey(0xff0d,'Enter');}
  if(e.key==='Tab'){e.preventDefault();rfb.sendKey(0xff09,'Tab');}
});
el('keyboard').addEventListener('click',()=>{
  if(!rfb){status('เชื่อมต่อ Linux ก่อน');return;}
  const visible=input.classList.toggle('visible');
  el('keyboard').textContent=visible?'ซ่อนคีย์บอร์ด':'⌨ คีย์บอร์ด';
  if(visible)input.focus();else{input.blur();rfb.focus();}
  fitViewer();
});
function fullScreenMode(off=false){
  const enabled=!off&&!document.body.classList.contains('immersive');
  document.body.classList.toggle('immersive',enabled);
  el('full').textContent=enabled?'ออกเต็มจอ':'เต็มจอ';
  fitViewer();
}
el('disconnect').addEventListener('click',()=>{if(rfb)rfb.disconnect();});

el('cad').addEventListener('click',()=>{if(rfb)rfb.sendCtrlAltDel();});
el('full').addEventListener('click',()=>fullScreenMode());
el('exitFull').addEventListener('click',()=>fullScreenMode(true));
window.addEventListener('pagehide',()=>{if(rfb)rfb.disconnect();});
</script></body></html>
